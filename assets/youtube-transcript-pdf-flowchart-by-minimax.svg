<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <!-- Subtle drop shadow for PDF -->
    <filter id="pdfShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="4" dy="8" stdDeviation="12" flood-color="#2c2420" flood-opacity="0.12"/>
    </filter>
    <!-- Soft inner shadow for YouTube player -->
    <filter id="playerShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#1a1412" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background: warm cream -->
  <rect width="1600" height="1000" fill="#faf8f5"/>

  <!-- ============== LEFT ZONE: YouTube Source ============== -->
  <g id="youtube-source">
    <!-- YouTube player frame -->
    <rect x="180" y="320" width="320" height="200" rx="16" fill="#2c2420" filter="url(#playerShadow)"/>

    <!-- Play button circle -->
    <circle cx="340" cy="420" r="36" fill="#cc0000"/>
    <!-- Play triangle -->
    <polygon points="330,400 330,440 358,420" fill="#ffffff"/>

    <!-- Label above player -->
    <text x="340" y="285" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#6b6058">YOUTUBE</text>

    <!-- Floating subtitle fragments - scattered and misaligned -->
    <rect x="120" y="560" width="180" height="8" rx="2" fill="#958a82" opacity="0.7" transform="rotate(-2 210 564)"/>
    <rect x="140" y="580" width="140" height="8" rx="2" fill="#958a82" opacity="0.5" transform="rotate(1 210 584)"/>
    <rect x="100" y="600" width="200" height="8" rx="2" fill="#958a82" opacity="0.6" transform="rotate(-1 200 604)"/>
    <rect x="160" y="620" width="120" height="8" rx="2" fill="#958a82" opacity="0.4" transform="rotate(2 220 624)"/>
    <rect x="130" y="640" width="160" height="8" rx="2" fill="#958a82" opacity="0.55" transform="rotate(-0.5 210 644)"/>
    <rect x="150" y="660" width="100" height="8" rx="2" fill="#958a82" opacity="0.45" transform="rotate(1.5 200 664)"/>
  </g>

  <!-- ============== CENTER: Transformation ============== -->
  <g id="transformation">
    <!-- Thin horizontal flow line -->
    <line x1="520" y1="420" x2="1060" y2="420" stroke="#e5dfda" stroke-width="2"/>

    <!-- Copper arrow body -->
    <line x1="620" y1="420" x2="980" y2="420" stroke="#96603a" stroke-width="1.5"/>

    <!-- Diamond marker -->
    <polygon points="1000,420 1010,410 1020,420 1010,430" fill="#96603a"/>

    <!-- Arrow head -->
    <polygon points="1040,420 1020,408 1020,432" fill="#96603a"/>

    <!-- Label below -->
    <text x="800" y="470" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6b6058">Captions → Transcript → Chapters</text>
  </g>

  <!-- ============== RIGHT ZONE: PDF Output ============== -->
  <g id="pdf-output">
    <!-- PDF document with shadow -->
    <rect x="1080" y="280" width="280" height="380" rx="4" fill="#ffffff" filter="url(#pdfShadow)"/>
    <rect x="1080" y="280" width="280" height="380" rx="4" fill="none" stroke="#e5dfda" stroke-width="1"/>

    <!-- Label above PDF -->
    <text x="1220" y="245" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2" fill="#6b6058">PDF</text>

    <!-- Serif title at top -->
    <rect x="1100" y="310" width="240" height="16" rx="2" fill="#2c2420"/>
    <rect x="1100" y="332" width="180" height="10" rx="2" fill="#2c2420" opacity="0.7"/>

    <!-- Horizontal rule -->
    <line x1="1100" y1="360" x2="1340" y2="360" stroke="#e5dfda" stroke-width="1"/>

    <!-- Summary paragraph block -->
    <rect x="1100" y="380" width="240" height="8" rx="1" fill="#6b6058" opacity="0.6"/>
    <rect x="1100" y="395" width="220" height="8" rx="1" fill="#6b6058" opacity="0.5"/>
    <rect x="1100" y="410" width="200" height="8" rx="1" fill="#6b6058" opacity="0.4"/>

    <!-- Chapter heading -->
    <rect x="1100" y="450" width="100" height="10" rx="1" fill="#2c2420"/>

    <!-- Body text blocks -->
    <rect x="1100" y="470" width="240" height="6" rx="1" fill="#6b6058" opacity="0.5"/>
    <rect x="1100" y="483" width="230" height="6" rx="1" fill="#6b6058" opacity="0.45"/>
    <rect x="1100" y="496" width="200" height="6" rx="1" fill="#6b6058" opacity="0.4"/>
    <rect x="1100" y="509" width="180" height="6" rx="1" fill="#6b6058" opacity="0.35"/>

    <!-- Another chapter heading -->
    <rect x="1100" y="540" width="80" height="10" rx="1" fill="#2c2420"/>

    <!-- More body text -->
    <rect x="1100" y="560" width="240" height="6" rx="1" fill="#6b6058" opacity="0.5"/>
    <rect x="1100" y="573" width="220" height="6" rx="1" fill="#6b6058" opacity="0.45"/>
    <rect x="1100" y="586" width="160" height="6" rx="1" fill="#6b6058" opacity="0.4"/>
  </g>

  <!-- ============== Subtle connection dots ============== -->
  <circle cx="520" cy="420" r="3" fill="#96603a" opacity="0.6"/>
  <circle cx="1060" cy="420" r="3" fill="#96603a" opacity="0.6"/>

</svg>
